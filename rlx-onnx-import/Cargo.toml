[package]
name = "rlx-onnx-import"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "ONNX → RLX HIR import (bundle loader, ONNX protobuf, op lowering)"
repository.workspace = true
readme = "README.md"

[dependencies]
anyhow = "1"
bytemuck = "1"
half = "2"
onnx = "0.1.0"
protobuf = "1.7"
rlx-ir = { path = "../rlx-ir", version = "0.2.6", features = ["serialize"] }
rlx-runtime = { path = "../rlx-runtime", version = "0.2.6", default-features = false, features = ["cpu"], optional = true }
rlx-cpu = { path = "../rlx-cpu", version = "0.2.6", optional = true }
safetensors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
runtime = ["dep:rlx-runtime", "dep:rlx-cpu"]

[[bin]]
name = "rlx-onnx-import-report"
path = "src/bin/report.rs"

[[bin]]
name = "bundle-compile"
path = "src/bin/bundle_compile.rs"
required-features = ["runtime"]

[lints]
workspace = true

[dev-dependencies]
anyhow = "1"
rlx-runtime = { path = "../rlx-runtime", version = "0.2.6", default-features = false, features = ["cpu"] }
tempfile = "3"

