[package]
name = "rlx-wgpu"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "Cross-platform GPU backend for RLX via wgpu (Metal/Vulkan/DX12/WebGPU)"
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
homepage.workspace     = true
documentation.workspace = true
[features]
default = []
native-splat = []
# `Op::GaussianSplatRender` via CPU reference (D2H) when `splat` is enabled.
splat = ["rlx-cpu/splat"]

[dependencies]
rlx-ir = { path = "../rlx-ir", version = "0.2.10" }
rlx-opt = { path = "../rlx-opt", version = "0.2.10", default-features = false, features = ["compile"] }
rlx-compile = { path = "../rlx-compile", version = "0.2.10" }
rlx-cpu = { path = "../rlx-cpu", version = "0.2.10", features = ["splat"] }
rlx-gguf = { path = "../rlx-gguf", version = "0.2.10" }

# wgpu 29: brings naga WGSL parser support for `enable f16;` and the
# `f16` type, which unlocks the half-precision storage matmul path.
# Backends picked explicitly. DX12 is enabled for native Windows tensor-core
# paths (preferred over Vulkan when the adapter supports it). GLES excluded.
wgpu = { version = "29", default-features = false, features = [
    "std",
    "parking_lot",
    "vulkan",
    "dx12",
    "metal",
    "wgsl",
    "webgpu",
] }
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
half = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Path-only (no version): test-only cycle on the umbrella crate, which is
# published last. cargo strips path-only dev-deps from the published manifest,
# so this never resolves against crates.io and needs no per-release pin bump.
rlx = { path = "../rlx", default-features = false, features = ["cpu", "gpu"] }
half = "2"
pollster = "0.3"
bytemuck = "1"

[lints]
workspace = true
