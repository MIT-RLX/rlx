[package]
name = "rlx-bench"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "PLAN L5 — uniform benchmark harness for RLX backends + patterns"
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
homepage.workspace     = true
documentation.workspace = true
[dependencies]
rlx-ir = { path = "../rlx-ir", version = "0.2.10" }
rlx-opt = { path = "../rlx-opt", version = "0.2.10" }
rlx-fusion = { path = "../rlx-fusion", version = "0.2.10" }
rlx-runtime = { path = "../rlx-runtime", version = "0.2.10", features = ["cpu"] }
rlx-cpu = { path = "../rlx-cpu", version = "0.2.10" }
rlx-gguf = { path = "../rlx-gguf", version = "0.2.10" }
rlx-driver = { path = "../rlx-driver", version = "0.2.10" }
rlx-mlx = { path = "../rlx-mlx", version = "0.2.10", optional = true }

[features]
default = []
metal = ["rlx-runtime/metal"]
mlx   = ["rlx-runtime/mlx", "dep:rlx-mlx"]
mlx-cuda = ["mlx", "rlx-mlx/cuda"]
gpu   = ["rlx-runtime/gpu"]
cuda  = ["rlx-runtime/cuda"]
# Single-kernel on-chip FFT for Metal/wgpu (A/B against the multi-kernel path
# via RLX_FFT_FAST=0). Pair with `metal` and/or `gpu`.
native-gpu-fft = ["rlx-runtime/native-gpu-fft"]
rocm  = ["rlx-runtime/rocm"]
tpu   = ["rlx-runtime/tpu"]
# Apple CoreML/ANE backend (Device::Ane). FFT runs host-side via rlx-coreml.
coreml = ["rlx-runtime/coreml"]
# Apple Accelerate BLAS (Device::Cpu); affects matmul, not FFT.
accelerate = ["rlx-runtime/blas-accelerate"]

[lints]
workspace = true
