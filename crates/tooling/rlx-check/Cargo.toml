[package]
name = "rlx-check"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
description = "Device-free static graph checker for RLX — backend dispatch, fusion, shape/dtype and numeric diagnostics (`cargo rlx check`)"
authors.workspace       = true
license.workspace       = true
keywords.workspace      = true
categories.workspace    = true
readme                  = "README.md"
repository.workspace    = true
documentation.workspace = true

# `cargo rlx check` — Cargo runs the `cargo-rlx` binary and passes the
# subcommand name (`rlx`) as the first argument, which the binary skips.
[[bin]]
name = "cargo-rlx"
path = "src/bin/cargo-rlx.rs"

[dependencies]
# The checker itself lives in `rlx_runtime::check` (single source of truth,
# reachable from the `#[rlx_model(check)]` hook). This crate is the CLI + demos.
# rlx-runtime default = ["cpu"], portable everywhere; other backends' execution
# legality is opt-in below and needs that backend's build deps.
rlx-runtime = { workspace = true }
# serialize: serde derives on Graph/Op/Shape so the CLI can load a graph from JSON.
rlx-ir      = { workspace = true, features = ["serialize"] }
serde_json  = "1"
# `cargo rlx dist` cluster files.
serde       = { version = "1", features = ["derive"] }
# `cargo rlx nodes`: nodes advertised over Bonjour/Avahi (pure-Rust mDNS).
rlx-driver  = { workspace = true, features = ["mdns"] }
toml        = "0.8"
# `cargo rlx setup xdna` (toolchain install plan + discovery); feature `xdna`.
rlx-xdna    = { workspace = true, optional = true }

[dev-dependencies]
# End-to-end test of the `#[rlx_model(check)]` self-check hook.
rlx-macros = { workspace = true }

[features]
# `cargo rlx dist` hosts linked over Bluetooth LE (`via = "ble"`).
ble = ["rlx-driver/ble"]
# Source-scanning gates over the whole op set (needs rlx-ir's sample_ops).
op-gates = ["rlx-ir/test-support"]
default = []
# Enable a backend's real execution-legality check (native/common-ir/unsupported).
# Without it, that backend still gets device-free *fusion* coverage.
metal  = ["rlx-runtime/metal"]
mlx    = ["rlx-runtime/mlx"]
gpu    = ["rlx-runtime/gpu"]
cuda   = ["rlx-runtime/cuda"]
rocm   = ["rlx-runtime/rocm"]
tpu    = ["rlx-runtime/tpu"]
coreml = ["rlx-runtime/coreml"]
# Further backends `cargo rlx doctor` can report on (it sees only what is built in).
vulkan = ["rlx-runtime/vulkan"]
oneapi = ["rlx-runtime/oneapi"]
xdna   = ["rlx-runtime/xdna", "dep:rlx-xdna"]
egpu   = ["rlx-runtime/egpu"]

[lints]
workspace = true

[package.metadata.docs.rs]
features       = ["op-gates"]
rustdoc-args   = ["--cfg", "docsrs"]
all-features   = false
