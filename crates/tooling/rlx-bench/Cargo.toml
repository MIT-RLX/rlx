[package]
name = "rlx-bench"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "PLAN L5 — uniform benchmark harness for RLX backends + patterns"
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
homepage.workspace     = true
documentation.workspace = true
[dependencies]
rlx-ir = { workspace = true }
rlx-opt = { workspace = true }
rlx-fusion = { workspace = true }
rlx-runtime = { workspace = true, features = ["cpu"] }
rlx-cpu = { workspace = true }
rlx-gguf = { workspace = true }
rlx-driver = { workspace = true }
rlx-mlx = { workspace = true, optional = true }

# `rlx-gpu`: read-only GPU temperature/power monitor. Reaches hardware
# only when built with a backend feature (`--features cuda` / `rocm`);
# otherwise prints an empty inventory.
[[bin]]
name = "rlx-gpu"
path = "src/bin/rlx_gpu.rs"

[features]
default = []
metal = ["rlx-runtime/metal"]
mlx   = ["rlx-runtime/mlx", "dep:rlx-mlx"]
mlx-cuda = ["mlx", "rlx-mlx/cuda"]
gpu   = ["rlx-runtime/gpu"]
cuda  = ["rlx-runtime/cuda"]
# Single-kernel on-chip FFT for Metal/wgpu (A/B against the multi-kernel path
# via RLX_FFT_FAST=0). Pair with `metal` and/or `gpu`.
native-gpu-fft = ["rlx-runtime/native-gpu-fft"]
rocm  = ["rlx-runtime/rocm"]
tpu   = ["rlx-runtime/tpu"]
# Apple CoreML/ANE backend (Device::Ane). FFT runs host-side via rlx-coreml.
coreml = ["rlx-runtime/coreml"]
# Apple Accelerate BLAS (Device::Cpu); affects matmul, not FFT.
accelerate = ["rlx-runtime/blas-accelerate"]

[lints]
workspace = true
