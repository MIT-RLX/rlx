[package]
name = "rlx-model-plugin"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "The reference rlx model plugin: a provider in a shared library that librlx_capi (and every language binding) loads at run time — the shape a downstream model collection's plugin takes"
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
publish = false

[lib]
# `cdylib`: the plugin librlx_capi loads (RLX_MODEL_PLUGINS); `rlib`: its tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Only rlx-runtime: a plugin never links the binding it plugs into.
rlx-runtime = { path = "../../core/rlx-runtime", version = "0.2.18", default-features = false }
rlx-ir      = { workspace = true }
anyhow      = "1"
serde_json  = "1"
