[package]
name = "pyrlx"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "Python bindings for rlx — run RLX graphs and HF models on any RLX backend"
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
documentation.workspace = true
# Not on crates.io: pyrlx is distributed via maturin → PyPI as
# Python wheels, not as a Rust library. Build from source with
# `maturin develop` or grab a wheel from the GitHub Releases page.
publish = false

[lib]
name = "pyrlx"
crate-type = ["cdylib", "rlib"]
# No Rust tests live here (they are the pytest suite, `just test-pyrlx`). An
# empty test binary still links libpython, and on a host without python3-dev
# that one link error aborted the whole `cargo test --workspace` build — zero
# tests ran on the Linux rig.
test = false
doctest = false

[features]
# Backend selection mirrors rlx-runtime. Default = whatever's
# always available everywhere (cpu).
# `extension-module` (also what maturin passes) keeps every cargo build from
# linking libpython: the symbols resolve when Python imports the module. The
# macOS half of the same fix is build.rs's `-undefined dynamic_lookup`.
default = ["cpu", "gguf-convert", "training", "text", "models", "extension-module"]
extension-module = ["pyo3/extension-module"]

cpu             = ["rlx-runtime/cpu"]
gguf-convert    = ["rlx-gguf-convert/safetensors", "rlx-bind/gguf-convert"]
gguf-onnx       = ["rlx-gguf-convert/onnx", "rlx-bind/gguf-onnx"]
gguf-pt         = ["rlx-gguf-convert/pt", "rlx-bind/gguf-pt"]
blas-accelerate = ["rlx-runtime/blas-accelerate"]
blas-mkl        = ["rlx-runtime/blas-mkl"]
blas-openblas   = ["rlx-runtime/blas-openblas"]
metal           = ["rlx-runtime/metal"]
mlx             = ["rlx-runtime/mlx"]
gpu             = ["rlx-runtime/gpu"]
cuda            = ["rlx-runtime/cuda"]
fpga            = ["rlx-runtime/fpga", "dep:rlx-fpga"]
# `pyrlx.Trainer` / `pyrlx.Optimizer` — Adam, AdamW, Muon, SOAP, … (rlx-optim).
training        = ["rlx-runtime/training", "rlx-bind/training"]
# `pyrlx.load_tokenizer` / `render_chat` / `Sampler` — the LM text layer (rlx-text).
text            = ["rlx-bind/text"]
# `Model` — models from any provider (`.rlxp`, plugins).
models          = ["rlx-bind/models"]

[dependencies]
pyo3      = { version = "0.22", features = ["abi3-py39", "multiple-pymethods"] }
numpy     = "0.22"

rlx-bind = { workspace = true, features = ["gguf-io", "weights", "runtime"] }
rlx-ir = { workspace = true }
rlx-opt = { workspace = true }
rlx-runtime = { path = "../../core/rlx-runtime", version = "0.2.19", default-features = false, features = ["model-io"] }
rlx-fpga = { workspace = true, optional = true }
rlx-gguf-convert = { path = "../../io/rlx-gguf-convert", version = "0.2.19", default-features = false, features = ["safetensors"] }
[lints]
workspace = true
