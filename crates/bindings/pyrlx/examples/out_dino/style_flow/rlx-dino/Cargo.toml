version = "0.1.0"
edition = "2021"
publish = false
description = "RLX native model generated from a PyTorch model by rlx-torch-import"

[dependencies]
anyhow = "1"
half = "2"
safetensors = "0.7"
rlx-ir = { path = "/Users/Shared/rlx/crates/core/rlx-ir", features = ["serialize"] }
rlx-runtime = { path = "/Users/Shared/rlx/crates/core/rlx-runtime", default-features = false, features = ["cpu"] }
