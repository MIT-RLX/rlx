[package]
name = "rlx-ffi"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
homepage.workspace     = true
documentation.workspace = true
description = "C ABI for the RLX distributed node — link a mesh worker into iOS, an embedded host, or any non-Rust shell"

[lib]
# `staticlib` is the portable choice: an iOS .xcframework links a static
# archive, and a C host on embedded Linux links it just as happily. `cdylib` is
# deliberately absent — a shared library must resolve every symbol at link
# time, and zstd-sys (pulled in via the GGUF reader) does not on iOS. `rlib` so
# the tests here exercise the same entry points.
crate-type = ["staticlib", "rlib"]

[dependencies]
# default-features off: a node needs the runtime's graph execution + `dist`
# module, not every backend. Shells opt into hardware via the features below.
rlx-runtime = { path = "../../core/rlx-runtime", version = "0.2.16", default-features = false, features = ["cpu"] }

[features]
default = []
# Apple GPU + Neural Engine for an iOS/macOS node. Off by default so the
# archive cross-compiles to embedded targets with no Apple frameworks.
apple = ["rlx-runtime/metal", "rlx-runtime/coreml"]
# Portable GPU (wgpu → Vulkan/Metal) for Android and desktop shells.
gpu = ["rlx-runtime/gpu"]

[dev-dependencies]
# The coordinator example builds the demo stage graph the phones run.
rlx-ir = { path = "../../core/rlx-ir", version = "0.2.16" }
# `--train` needs the backward graph for the demo model. Path-only: dev-deps
# are stripped from the published manifest, so this adds no release edge.
rlx-autodiff = { path = "../../core/rlx-autodiff" }

[lints]
workspace = true

[package.metadata.docs.rs]
features       = ["gpu"]
rustdoc-args   = ["--cfg", "docsrs"]
all-features   = false
