[package]
name = "rlx-js"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "Embedded JavaScript bindings for rlx — drive RLX graphs, backends and weights from a script"
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
documentation.workspace = true
# Not on crates.io yet: the JS surface is still moving. (The engine,
# `quickrs-core`, is published, so this is the only thing holding it back.)
publish = false

[features]
# Mirrors rlx-runtime's backend gates. `cpu` is the only one every host has.
default = ["cpu", "gguf", "weights", "training", "text", "models"]

cpu             = ["rlx-runtime/cpu"]
blas-accelerate = ["rlx-runtime/blas-accelerate"]
blas-mkl        = ["rlx-runtime/blas-mkl"]
blas-openblas   = ["rlx-runtime/blas-openblas"]
metal           = ["rlx-runtime/metal"]
mlx             = ["rlx-runtime/mlx"]
gpu             = ["rlx-runtime/gpu"]
cuda            = ["rlx-runtime/cuda"]
rocm            = ["rlx-runtime/rocm"]
vulkan          = ["rlx-runtime/vulkan"]

# `rlx.openGguf` — read / dequantize / write GGUF from script.
gguf = ["rlx-bind/gguf-io"]

# `rlx.loadTokenizer` / `renderChat` / `sampleNext` — the LM text layer.
text = ["rlx-bind/text"]

# `rlx.Trainer` / `rlx.Optimizer` — Adam, AdamW, Muon, SOAP, … from script.
training = ["rlx-runtime/training", "rlx-bind/training"]

# `rlx.Model` — models from any provider: `.rlxp` packages and plugins
# (RLX_MODEL_PLUGINS).
models = ["rlx-bind/models"]

# `rlx.exportFpga` — SystemVerilog export (rlx-fpga).
fpga = ["rlx-bind/fpga"]

# `rlx.convertToGguf` — safetensors → GGUF with per-tensor quant schemes.
gguf-convert = ["gguf", "rlx-bind/gguf-convert"]

# `rlx.loadMlx` / `loadDduf` / `loadNemo` / `loadPt` / `openRlxp` / `toRlxp`.
weights = ["rlx-bind/weights"]

# `graph.toJSON()`. Off by default: it needs `rlx-ir/serialize`, and feature
# unification would switch that on for every crate in a `--workspace` build.
graph-json = ["rlx-ir/serialize", "dep:serde_json"]

[dependencies]
# Pure-Rust QuickJS-ng, from crates.io. To iterate on the engine alongside
# this binding, add a `[patch.crates-io]` entry for a local checkout rather
# than reintroducing a path dep — a path dep makes the whole workspace
# unresolvable for anyone without that sibling directory.
quickrs-core = { version = "0.16.2", default-features = false, features = ["std"] }

# The op table, runtime and I/O logic every binding shares; the features
# above switch on the matching parts of it.
rlx-bind    = { workspace = true, features = ["runtime"] }
rlx-ir      = { workspace = true }
rlx-runtime = { path = "../../core/rlx-runtime", version = "0.2.19", default-features = false, features = ["model-io"] }
serde_json  = { version = "1", optional = true }

[[bin]]
name = "rlx-js"
path = "src/bin/rlx_js.rs"

[lints]
workspace = true
