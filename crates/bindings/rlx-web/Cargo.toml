[package]
name = "rlx-web"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "WebAssembly entry point for RLX — run models in the browser (CPU backend; WebGPU device bring-up)"
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
homepage.workspace     = true
documentation.workspace = true

[lib]
# `cdylib` for the `.wasm` artifact; `rlib` so the crate is checkable on
# native targets (CI) and usable as a normal dependency.
crate-type = ["cdylib", "rlib"]

[features]
default = []
# WebGPU compute path (async forward/backward via browser runtime).
webgpu = ["dep:rlx-wgpu", "rlx-runtime/webgpu", "rlx-runtime/browser"]
# WebGL2 render-to-texture path (sync forward/backward via browser runtime).
webgl = ["dep:rlx-webgl", "rlx-runtime/opengl", "rlx-runtime/browser"]
# Both browser GPU paths.
browser = ["webgpu", "webgl"]

[dependencies]
rlx-ir = { path = "../../core/rlx-ir", version = "0.2.13" }
rlx-autodiff = { path = "../../core/rlx-autodiff", version = "0.2.13" }
rlx-opt = { path = "../../core/rlx-opt", version = "0.2.13" }
rlx-runtime = { path = "../../core/rlx-runtime", version = "0.2.13", default-features = false, features = ["cpu"] }
wasm-bindgen = "0.2.118"
rlx-wgpu = { path = "../../backends/rlx-wgpu", version = "0.2.13", optional = true }
rlx-webgl = { path = "../../backends/rlx-webgl", version = "0.2.13", optional = true }

# wasm-only plumbing: async export support + console logging for panics.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.68"
web-sys = { version = "0.3.95", features = ["console", "Window", "Performance"] }

[lints]
workspace = true
