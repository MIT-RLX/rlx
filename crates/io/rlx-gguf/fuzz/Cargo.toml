[package]
name = "rlx-gguf-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.rlx-gguf]
path = ".."

# Own workspace so the main rlx workspace ignores this crate entirely
# (keeps the root Cargo.toml / Cargo.lock untouched).
[workspace]
members = ["."]
resolver = "2"

[profile.release]
debug = 1

# Fuzz targets are built as `#![no_main]` binaries by cargo-fuzz; keep the
# regular test/doc/bench harnesses off so a plain `cargo check` stays clean.
[[bin]]
name = "gguf_parse"
path = "fuzz_targets/gguf_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gguf_dequant"
path = "fuzz_targets/gguf_dequant.rs"
test = false
doc = false
bench = false
