# Pure-Rust ONNX protobuf types. This is a vendored, protoc-free replacement for
# the crates.io `onnx` crate, whose build.rs shelled out to the external `protoc`
# binary to code-generate `src/onnx.rs` on every build. Here `src/onnx.rs` is the
# checked-in rust-protobuf 3.7.2 output for `onnx.proto` (also checked in); the only
# runtime dependency is the pure-Rust `protobuf` crate. The generated code asserts
# its exact runtime version, hence the `=` pin. Regenerate with
# `cargo run --manifest-path crates/io/rlx-onnx-proto/regen/Cargo.toml` (see README).
[package]
name = "rlx-onnx-proto"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "Vendored pure-Rust ONNX protobuf types (protoc-free)"
authors.workspace      = true
license.workspace      = true
keywords = ["onnx", "protobuf", "serialization", "rlx"]
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
documentation.workspace = true

[dependencies]
protobuf = "=3.7.2" # must match the codegen version in regen/Cargo.toml

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
