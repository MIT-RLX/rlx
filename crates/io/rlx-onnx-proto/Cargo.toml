# Pure-Rust ONNX protobuf types. This is a vendored, protoc-free replacement for
# the crates.io `onnx` crate, whose build.rs shelled out to the external `protoc`
# binary to code-generate `src/onnx.rs` on every build. Here `src/onnx.rs` is the
# checked-in rust-protobuf output; the only runtime dependency is the pure-Rust
# `protobuf` crate. `src/onnx.rs` was post-processed to add `dyn` before its `Any`
# trait objects so it builds on a modern edition. Regenerate only if the ONNX
# schema changes: rust-protobuf 1.x output, then `sed` the bare `::std::any::Any`
# refs to `dyn ::std::any::Any`.
[package]
name = "rlx-onnx-proto"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "Vendored pure-Rust ONNX protobuf types (protoc-free)"
authors.workspace      = true
license.workspace      = true
keywords = ["onnx", "protobuf", "serialization", "rlx"]
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
homepage.workspace     = true
documentation.workspace = true

[dependencies]
protobuf = "1.7"

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
