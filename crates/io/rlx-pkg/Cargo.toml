[package]
name = "rlx-pkg"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "RLX package format (.rlxp) — flat hybrid mmap packs, optional graph, ZIP/dir"
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
homepage.workspace     = true
documentation.workspace = true

[[bin]]
name = "rlx-pkg"
path = "src/bin/rlx-pkg.rs"

[features]
default = []
# Password seal for cold/sidecar members (ChaCha20-Poly1305 + Argon2id).
encrypt = ["dep:chacha20poly1305", "dep:argon2", "dep:rand_core"]
# HTTP(S) Range reader for remote `.rlxp` (TOC + selected blobs).
remote = ["dep:ureq"]

[dependencies]
rlx-ir = { path = "../../core/rlx-ir", version = "0.2.13", features = ["serialize"] }
rlx-gguf = { path = "../rlx-gguf", version = "0.2.13" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
memmap2 = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = "0.13"
rayon = "1.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
chacha20poly1305 = { version = "0.10", optional = true }
argon2 = { version = "0.5", optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
ureq = { version = "2", optional = true, default-features = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"

[[bench]]
name = "hybrid_load"
harness = false

[[bench]]
name = "q4k_compare"
harness = false

[[example]]
name = "bench_hybrid"
path = "examples/bench_hybrid.rs"

[[example]]
name = "bench_compare"
path = "examples/bench_compare.rs"

[lints]
workspace = true
