[package]
name = "rlx-pkg"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "RLX package format (.rlxp) — flat hybrid mmap packs, optional graph, ZIP/dir"
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
documentation.workspace = true

[[bin]]
name = "rlx-pkg"
path = "src/bin/rlx-pkg.rs"
required-features = ["convert"]

[features]
# Reading a package (flat / dir / ZIP, every tier) is always built and is pure
# Rust, so it compiles for wasm32 too. The rest is opt-out:
default = ["write", "convert", "parallel"]
# Writing packages: `write_package*`, `build`, auto-tiering, `package_from_bake`.
write = []
# Importers into `.rlxp` (`*_to_rlxp`: GGUF, MLX, DDUF, NeMo, PyTorch) — the
# archive stack (rlx-mlx-io, rlx-dduf, rlx-nemo, serde_yaml).
convert = ["write", "dep:rlx-gguf", "dep:rlx-mlx-io", "dep:rlx-dduf", "dep:rlx-nemo", "dep:serde_yaml"]
# Warm-tier blocks decoded on rayon's pool (sequential without it).
parallel = ["dep:rayon"]
# libzstd (C, via `zstd`) for the warm/cold codec instead of pure-Rust `zstd-rs`:
# ~1.3-1.6x faster decode and encode. Native only — ignored on wasm32. For
# baking (rlx-bake).
zstd-native = ["dep:zstd"]
# Password seal for cold/sidecar members (ChaCha20-Poly1305 + Argon2id).
encrypt = ["dep:chacha20poly1305", "dep:argon2", "dep:rand_core"]
# HTTP(S) Range reader for remote `.rlxp` (TOC + selected blobs).
remote = ["dep:ureq"]

[dependencies]
rlx-ir = { workspace = true, features = ["serialize"] }
rlx-gguf = { workspace = true, optional = true }
rlx-mlx-io = { workspace = true, optional = true }
rlx-dduf = { workspace = true, optional = true }
rlx-nemo = { workspace = true, optional = true }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { version = "0.9", optional = true }
bincode = "1"
memmap2 = "0.9"
zip = { version = "9", default-features = false, features = ["deflate"] }
rayon = { version = "1.10", optional = true }
# Pure-Rust zstd: the warm/cold codec everywhere (wasm32 included) —
# `forbid(unsafe_code)`, every decode capped, real levels (-7..=22), decoding
# libzstd's frames byte-identically (measured: weights / EDF / JSON).
zstd-rs = "=0.1.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
chacha20poly1305 = { version = "0.10", optional = true }
argon2 = { version = "0.5", optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
ureq = { version = "2", optional = true, default-features = true }

# libzstd is C (and cannot build for wasm32): only behind `zstd-native`.
# >= 0.14.3: RUSTSEC-2026-0391 / -0403.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd = { version = "0.14.3", optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"
safetensors = "0.7"

# libzstd and ruzstd as independent decoders/encoder in the codec interop test.
ruzstd = "0.9.1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
zstd = "0.14.3"

[[bench]]
name = "hybrid_load"
required-features = ["write"]
harness = false

[[bench]]
name = "q4k_compare"
required-features = ["write"]
harness = false

[[example]]
name = "bench_hybrid"
required-features = ["write"]
path = "examples/bench_hybrid.rs"

[[example]]
name = "bench_compare"
required-features = ["write"]
path = "examples/bench_compare.rs"

[lints]
workspace = true

[package.metadata.docs.rs]
features       = ["encrypt", "remote"]
rustdoc-args   = ["--cfg", "docsrs"]
all-features   = false
