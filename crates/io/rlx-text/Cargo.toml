[package]
name = "rlx-text"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "RLX text — tokenizer wrappers, chat templates, sampling. Public surface for downstream LM apps."
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
documentation.workspace = true

[dependencies]
rlx-runtime  = { workspace = true }
rlx-gguf     = { workspace = true }
anyhow       = "1"
minijinja    = { version = "2.24", default-features = false, features = ["builtins", "macros", "serde"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"

# Regex backend: tokenizers' pure-Rust `fancy-regex` everywhere (no C:
# `onig` is the C Oniguruma library). wasm32 additionally needs
# `unstable_wasm` (getrandom's JS backend).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokenizers   = { version = "0.22", default-features = false, features = ["fancy-regex"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokenizers   = { version = "0.22", default-features = false, features = ["unstable_wasm"] }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args   = ["--cfg", "docsrs"]
all-features   = false
