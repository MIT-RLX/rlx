[package]
name = "rlx-text"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "RLX text — tokenizer wrappers, chat templates, sampling. Public surface for downstream LM apps."
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
homepage.workspace     = true
documentation.workspace = true

[dependencies]
rlx-runtime  = { path = "../../core/rlx-runtime", version = "0.2.14" }
rlx-gguf     = { path = "../rlx-gguf",    version = "0.2.14" }
anyhow       = "1"
minijinja    = { version = "2", default-features = false, features = ["builtins", "macros", "serde"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
tokenizers   = { version = "0.22", default-features = false, features = ["onig"] }

[lints]
workspace = true
