[package]
name = "rlx-onnx-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "ONNX op-level conformance tests (ORT reference vs RLX import/execute)"
repository.workspace = true
readme = "README.md"

[dependencies]
anyhow = "1"
rlx-onnx-import = { path = "../rlx-onnx-import", version = "0.2.14" }
rlx-ir = { path = "../../core/rlx-ir", version = "0.2.14" }
serde_json = "1"

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
ort = { version = "=2.0.0-rc.11", default-features = false, features = [
    "std",
    "download-binaries",
    "tls-rustls",
] }

[dev-dependencies]
tempfile = "3"
rlx-runtime = { path = "../../core/rlx-runtime", default-features = false, features = ["cpu"] }
rlx-ir = { path = "../../core/rlx-ir", version = "0.2.14" }
rlx-opt = { path = "../../core/rlx-opt", version = "0.2.14" }
rlx-compile = { path = "../../core/rlx-compile", version = "0.2.14" }

[lints]
workspace = true

[[bin]]
name = "rlx-onnx-coverage"
path = "src/bin/coverage_dashboard.rs"
