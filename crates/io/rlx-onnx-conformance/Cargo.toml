[package]
name = "rlx-onnx-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "ONNX op-level conformance tests (ORT reference vs RLX import/execute)"
repository.workspace = true
readme = "README.md"
keywords.workspace      = true
categories.workspace    = true
homepage.workspace      = true
documentation.workspace = true

[dependencies]
anyhow = "1"
rlx-onnx-import = { workspace = true }
rlx-ir = { workspace = true }
serde_json = "1"

# ORT ships prebuilt binaries for the desktop platforms plus iOS and Android.
# It ships none for tvOS, watchOS or visionOS, and this dependency is not
# optional, so a build script — not a link step — is what fails there. Those
# three are excluded by target_vendor rather than by name so a future Apple OS
# lands on the stub instead of on a download that does not exist.
[target.'cfg(not(any(target_os = "android", all(target_vendor = "apple", not(target_os = "macos")))))'.dependencies]
ort = { version = "=2.0.0-rc.11", default-features = false, features = [
    "std",
    "download-binaries",
    "tls-rustls",
] }

[dev-dependencies]
tempfile = "3"
rlx-runtime = { path = "../../core/rlx-runtime", default-features = false, features = ["cpu"] }
rlx-ir = { workspace = true }
rlx-opt = { workspace = true }
rlx-compile = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "rlx-onnx-coverage"
path = "src/bin/coverage_dashboard.rs"

[package.metadata.docs.rs]
rustdoc-args   = ["--cfg", "docsrs"]
all-features   = false
