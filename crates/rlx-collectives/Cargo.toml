[package]
name = "rlx-collectives"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
description = "In-graph collective ops (all-reduce) for tensor-parallel RLX execution"

[dependencies]
rlx-ir = { path = "../rlx-ir", version = "0.2.10" }
rlx-cpu = { path = "../rlx-cpu", version = "0.2.10" }
rlx-driver = { path = "../rlx-driver", version = "0.2.10" }

[dev-dependencies]
# Path-only (no version): test-only cycle on rlx-runtime, which publishes
# right after rlx-collectives in the same tier (7). cargo strips path-only
# dev-deps from the published manifest, so this never resolves against
# crates.io and needs no per-release pin bump.
rlx-runtime = { path = "../rlx-runtime", default-features = false, features = ["cpu"] }

[lints]
workspace = true
