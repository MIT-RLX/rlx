[package]
name = "rlx-collectives"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
description = "In-graph collective ops (all-reduce) for tensor-parallel RLX execution"

[dependencies]
rlx-ir = { path = "../rlx-ir", version = "0.2.10" }
rlx-cpu = { path = "../rlx-cpu", version = "0.2.10" }
rlx-driver = { path = "../rlx-driver", version = "0.2.10" }

[dev-dependencies]
# Path-only (no version): test-only cycle on rlx-runtime, which publishes
# right after rlx-collectives in the same tier (7). cargo strips path-only
# dev-deps from the published manifest, so this never resolves against
# crates.io and needs no per-release pin bump.
rlx-runtime = { path = "../rlx-runtime", default-features = false, features = ["cpu"] }
# The coordinator/worker mode ships serialized IR graphs over the wire, so the
# example needs rlx-ir's serde derives + a JSON codec (dev-only).
rlx-ir = { path = "../rlx-ir", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The `dist_node` example drives the native GPU backend of whichever host
# it runs on. Cargo unions feature sets across these tables, so the crate's
# dev builds get cpu+metal on macOS and cpu+cuda on Linux, while staying
# cpu-only everywhere else. Local-only (path dev-dep, stripped on publish).
[target.'cfg(target_os = "macos")'.dev-dependencies]
rlx-runtime = { path = "../rlx-runtime", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rlx-runtime = { path = "../rlx-runtime", default-features = false, features = ["cuda"] }

[lints]
workspace = true
