[package]
name = "rlx-metal"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "Metal backend for RLX — Apple Silicon GPU via Metal Performance Shaders + custom MSL kernels"
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
homepage.workspace     = true
documentation.workspace = true
[dependencies]
rlx-ir = { path = "../rlx-ir", version = "0.2.10" }
rlx-opt = { path = "../rlx-opt", version = "0.2.10" }
# rlx-cpu is pulled in solely for its FFT host-fallback kernels
# (`execute_fft1d_f32` / `execute_fft1d_f64`) — Apple Silicon's
# unified memory lets us run them against the Metal arena pointer
# with no copies. A native Metal FFT kernel will replace this when a
# real workload justifies the .metal kernel work.
rlx-cpu = { path = "../rlx-cpu", version = "0.2.10", features = ["splat"] }
# IQ-family grid LUTs (KGRID_IQ2XXS, etc.) staged into a Metal device
# buffer for the IQ2/IQ3/IQ1 dequant kernels.
rlx-gguf = { path = "../rlx-gguf", version = "0.2.10" }
bytemuck = { version = "1", features = ["derive"] }
# rlx-splat moved out of tree; restore with the native-splat feature below.
# rlx-splat = { path = "../rlx-splat", version = "0.2.10", optional = true, default-features = false, features = ["reference", "metal"] }

[features]
default = []
# Native MSL raster via `rlx-splat` + `splat.msl` (no `rlx-runtime` on `rlx-splat` — no cycle).
# rlx-splat moved to ../rlx-splat; no-op feature (was ["dep:rlx-splat"]) — keeps cfg gates valid.
native-splat = []

[target.'cfg(all(target_vendor = "apple", not(target_os = "watchos")))'.dependencies]
metal = "0.30"
foreign-types = "0.5"
objc = "0.2"
core-graphics-types = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
half = "2"


[dev-dependencies]
# Back-edge: rlx-runtime (tier 7) publishes AFTER rlx-metal (tier 6), and no
# published rlx-runtime exposes the `metal` feature. Keep this PATH-ONLY (no
# `version`): cargo strips path-only dev-deps from the published manifest, so
# `cargo publish -p rlx-metal` never resolves runtime against crates.io. The
# path dep wins for local/workspace tests.
rlx-runtime = { path = "../rlx-runtime", features = ["metal"] }
rlx-gguf = { path = "../rlx-gguf", version = "0.2.10" }
rlx-cpu = { path = "../rlx-cpu", version = "0.2.10" }
half = "2"

[lints]
workspace = true

# Apple-Silicon-only crate; render docs against the macOS targets so
# the platform-conditional dependencies and types resolve.
[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets        = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
rustdoc-args   = ["--cfg", "docsrs"]
