[package]
name = "rlx-autodiff"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "JAX-shaped transforms for RLX MIR — autodiff, JVP/HVP, vmap"
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
homepage.workspace     = true
documentation.workspace = true

[dependencies]
rlx-ir = { path = "../rlx-ir", version = "0.2.8" }
rlx-fusion = { path = "../rlx-fusion", version = "0.2.8" }
half = "2"

[features]
default = []

[dev-dependencies]
# Path-only (no version): test-only cycle on the umbrella crate, which is
# published last. cargo strips path-only dev-deps from the published manifest,
# so this never resolves against crates.io and needs no per-release pin bump.
rlx = { path = "../rlx", default-features = false, features = ["cpu"] }

[lints]
workspace = true
