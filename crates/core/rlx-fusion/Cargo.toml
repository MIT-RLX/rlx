[package]
name = "rlx-fusion"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "Fusion passes and fused-op decomposition for RLX MIR"
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
documentation.workspace = true

[dependencies]
rlx-ir = { workspace = true }
# `lower_pocketfft`: the pocketfft plan (factors, twiddles) the GPU lowering replays.
rlx-pocketfft = { workspace = true }

[features]
default = []
# `ParallelizeAffineScan`: rewrite a `Scan` whose body is a diagonal affine
# recurrence (`h = a*h + b`) into a log-depth prefix scan of tensor ops.
# Not bit-identical to the sequential loop (different association order).
assoc-scan = []

[dev-dependencies]
# Textual-IR fixtures (`tests/text_fixtures.rs`) need rlx-ir's serde derives.
rlx-ir = { workspace = true, features = ["serialize"] }

# Back-edge dev-deps on later-tier crates: keep these PATH-ONLY (no
# `version`). cargo strips path-only dev-deps from the published manifest,
# so `cargo publish -p rlx-fusion` (tier 1) does not try to resolve
# rlx-cpu/rlx-opt (tier 4/5) against crates.io before they exist.
rlx-cpu = { path = "../../backends/rlx-cpu" }
rlx-opt = { path = "../rlx-opt", features = ["compile"] }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args   = ["--cfg", "docsrs"]
all-features   = false
