[package]
name = "rlx-flow"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "Block assembly-line API for RLX model builders — fusion-first, config-driven"
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
documentation.workspace = true

[dependencies]
rlx-ir = { workspace = true, features = ["serialize"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# `formats`: `SafetensorsSource` / `GgufSource` — `WeightSource`s that read
# checkpoint files. Off by default so the block API stays format-independent.
rlx-gguf = { workspace = true, features = ["ir"], optional = true }
memmap2 = { version = "0.9", optional = true }
serde_json = { version = "1", optional = true }
half = "2"

[features]
default = []
formats = ["dep:rlx-gguf", "dep:memmap2", "dep:serde_json"]

[dev-dependencies]
# Back-edges: rlx-opt (tier 4) and rlx-runtime (tier 7) both publish AFTER
# rlx-flow (tier 1), and rlx-runtime depends on rlx-flow, so the cycle cannot be
# broken by retiering. Keep these PATH-ONLY (no `version`): cargo strips
# path-only dev-deps from the published manifest, so `cargo publish -p rlx-flow`
# never resolves them against crates.io. `{ workspace = true }` does NOT work
# here — it inherits the workspace version, which cargo then tries
# to resolve and fails on ("candidate versions found which didn't match").
# The path still wins for local `cargo test`.
rlx-opt = { path = "../rlx-opt" }
rlx-runtime = { path = "../rlx-runtime", features = ["cpu", "training"] }
# `tests/weight_formats.rs` writes GGUF and safetensors files.
rlx-gguf = { workspace = true }
serde_json = "1"
half = "2"

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args   = ["--cfg", "docsrs"]
all-features   = false
features       = ["formats"]
