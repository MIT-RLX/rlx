[package]
name = "rlx-ir"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "Tensor IR for the RLX ML compiler — standalone, serializable, optimizable"
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
documentation.workspace = true
[dependencies]
smallvec = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
bincode = { version = "1", optional = true }
aes = "0.9.1"
# Float math `core` lacks (sqrt/sin/floor/…) for the `no_std` subset only;
# under `std` the inherent methods are used.
libm = "0.2"

[features]
default = ["std"]
# Everything. Without it the crate is `no_std` + `alloc` and keeps only the
# graph/op/shape/verify core (no env, no global custom-op registry, no
# HIR→LIR pipeline), so integer-only targets like rlx-fpga can still verify
# the graphs they build.
std = []
serialize = ["std", "dep:serde", "dep:serde_json", "dep:bincode"]
# One constructible `Op` per `OpKind` (`sample_ops`), so gates keyed on the op
# set can cover all of it instead of the handful a test author thought of.
# Off by default: it is test scaffolding, not part of the IR surface.
test-support = ["std"]
# No Apple frameworks: the BNNS samplers / fully-connected layer (Accelerate)
# compile to their non-macOS stubs. Additive, so it wins under unification.
pure-rust = []

[dev-dependencies]
[lints]
workspace = true

[package.metadata.docs.rs]
features       = ["serialize"]
rustdoc-args   = ["--cfg", "docsrs"]
all-features   = false
