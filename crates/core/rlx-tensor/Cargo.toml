[package]
name = "rlx-tensor"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "Native ndarray alternative for RLX — NumPy-style tensors that trace, fuse, and run on any backend via the rlx compiler"
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
homepage.workspace     = true
documentation.workspace = true

[dependencies]
rlx-ir = { path = "../rlx-ir", version = "0.2.14" }
rlx-macros = { path = "../rlx-macros", version = "0.2.14", optional = true }
rlx-runtime = { path = "../rlx-runtime", version = "0.2.14", default-features = false, optional = true }
rlx-autodiff = { path = "../rlx-autodiff", version = "0.2.14", optional = true }
rlx-optim = { path = "../rlx-optim", version = "0.2.14", optional = true }
ndarray = { version = "0.16", optional = true }

[features]
default = []
# `rlx! { … }` declarative graph DSL. Opt-in so the base crate stays a lean
# `rlx-ir` graph builder — this feature is the only thing that pulls in the
# `rlx-macros` proc-macro (and thus syn/quote) for `Tensor`-only consumers.
dsl = ["dep:rlx-macros"]
# JAX-shaped function transforms via `rlx_autodiff` (grad / vmap / jvp / hvp).
# Symbolic only; pair with `eval` to read values. `grad` and `transforms` are
# ergonomic aliases for the same `autodiff` umbrella.
autodiff = ["dep:rlx-autodiff"]
grad = ["autodiff"]
transforms = ["autodiff"]
# Materialization: compile a symbolic `Tensor` through `rlx_runtime::Session`
# and read host data back (`to_vec`, `on(device).to_vec()`). Opt-in so the
# base crate stays a pure rlx-ir graph builder with no backend pulled in.
# `eval` defaults to the CPU backend; enable `eval-metal` / `eval-cuda` /
# `eval-rocm` for `.on(Device::…)` on those backends.
eval = ["dep:rlx-runtime", "rlx-runtime/cpu"]
eval-metal = ["eval", "rlx-runtime/metal"]
eval-mlx = ["eval", "rlx-runtime/mlx"]
eval-gpu = ["eval", "rlx-runtime/gpu"]
eval-coreml = ["eval", "rlx-runtime/coreml"]
# All Apple GPU/NPU backends at once (Metal + MLX + wgpu + CoreML/ANE).
eval-apple = ["eval", "rlx-runtime/apple"]
# CPU eval with a BLAS/LAPACK backend (Apple Accelerate) — needed for
# DenseSolve-backed ops like `inv`. Pick the BLAS flavor for your platform.
eval-blas = ["eval", "rlx-runtime/blas-accelerate"]
# Zero-friction migration from `ndarray`: `Tensor::from(array)` and (with
# `eval`) `tensor.to_ndarray()`.
ndarray = ["dep:ndarray"]
eval-cuda = ["eval", "rlx-runtime/cuda"]
eval-rocm = ["eval", "rlx-runtime/rocm"]
# Training: a `Func::train_step` that runs value+grad and applies an
# `rlx_optim` optimizer to the bound params. Implies autodiff + eval.
optim = ["autodiff", "eval", "dep:rlx-optim"]

# Document the full API on docs.rs. Default features are empty, so without this
# the eval / transforms / optim / dsl surface — including the `rlx!` macro —
# would be hidden and every feature-gated intra-doc link would break. CPU-only
# set so it builds on the docs.rs runners.
[package.metadata.docs.rs]
features     = ["dsl", "eval", "transforms", "optim", "ndarray"]
rustdoc-args = ["--cfg", "docsrs"]
all-features = false

[dev-dependencies]

[lints]
workspace = true
