[package]
name = "rlx-driver"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "RLX driver layer — device handles, arenas, buffers, command streams"
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
homepage.workspace     = true
documentation.workspace = true
[dependencies]
rlx-ir = { path = "../rlx-ir", version = "0.2.10" }
half = "2"
# Zero-config LAN discovery (Bonjour/Avahi-compatible mDNS-SD), opt-in: the
# unicast rendezvous path needs no extra deps, so keep this off by default.
mdns-sd = { version = "0.13", optional = true }

[features]
default = []
# mDNS-SD service discovery for `Node` (advertise/browse `_rlx-coord._udp`).
mdns = ["dep:mdns-sd"]

[lints]
workspace = true
