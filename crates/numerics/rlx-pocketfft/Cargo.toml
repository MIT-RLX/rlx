[package]
name = "rlx-pocketfft"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "scipy.fft (pocketfft) reproduced bit-for-bit in pure Rust, with selectable FMA contraction and twiddle rounding"
authors.workspace      = true
license.workspace      = true
keywords = ["scipy", "fft", "pocketfft", "parity"]
categories = ["science", "mathematics"]
readme                 = "README.md"
repository.workspace   = true
documentation.workspace = true

[lib]
name = "rlx_pocketfft"
path = "src/lib.rs"


[dependencies]
# x87 `long double` (pypocketfft's ldbl_t on the Linux x86-64 reference)
rlx-linux-ref = { workspace = true }
# glibc's sin/cos off Apple (the Linux reference; wasm agrees)
rlx-libm = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args   = ["--cfg", "docsrs"]

[features]
# Platform C libm for rlx-libm's `reference` (macOS-exact NumPy/SciPy); off = pure Rust.
libm = ["rlx-libm/libm"]

# The test fixtures are SciPy on macOS arm64: tests compute with its libm.
# (Library builds default to the pure-Rust ports; see rlx-libm `libm`.)
[dev-dependencies]
rlx-libm = { workspace = true, features = ["libm"] }
