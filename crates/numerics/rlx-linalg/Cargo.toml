[package]
name = "rlx-linalg"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "Dense linear algebra for RLX — eigh / svd / qr / cholesky / solve_triangular via LAPACK. Downstream package; registers against rlx's custom-op scaffold."
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
documentation.workspace = true
# The NumPy routing fixtures (34 MB each, one per platform) and the parity
# test that embeds them stay in the repo: with both, the package was 14.3 MiB
# compressed, over crates.io's 10 MB limit.
exclude = ["tests/vectors", "tests/numpy_routing.rs"]
[features]
default = ["cpu"]

# CPU execution: pulls in rlx-cpu's CpuKernel registry + LAPACK
# wrappers (`dpotrf`, `dsyevd`, `dgeqrf`, `dgesvd`, `dtrsm`).
cpu = ["dep:rlx-cpu"]

[dependencies]
rlx-ir = { workspace = true }
rlx-cpu = { workspace = true, optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
features       = ["cpu"]
rustdoc-args   = ["--cfg", "docsrs"]
all-features   = false
