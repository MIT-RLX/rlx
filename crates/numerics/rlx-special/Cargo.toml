[package]
name = "rlx-special"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "Boost.Math special functions (incomplete beta/gamma, erf, lgamma, Student-t, chi-squared) reproduced bit-for-bit as SciPy computes them"
authors.workspace      = true
license.workspace      = true
keywords = ["scipy", "boost", "special-functions", "incomplete-beta", "parity"]
categories = ["science", "mathematics"]
readme                 = "README.md"
repository.workspace   = true
documentation.workspace = true

[lib]
name = "rlx_special"
path = "src/lib.rs"


[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args   = ["--cfg", "docsrs"]
