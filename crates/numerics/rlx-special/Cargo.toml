[package]
name = "rlx-special"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "Boost.Math special functions (incomplete beta/gamma, erf, lgamma, Student-t, chi-squared) reproduced bit-for-bit as SciPy computes them"
authors.workspace      = true
license.workspace      = true
keywords = ["scipy", "boost", "special-functions", "incomplete-beta", "parity"]
categories = ["science", "mathematics"]
readme                 = "README.md"
repository.workspace   = true
documentation.workspace = true

[lib]
name = "rlx_special"
path = "src/lib.rs"


[dependencies]
# the reference platform's libm: glibc's erfc/exp/pow off Apple (Linux and wasm agree)
rlx-libm = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args   = ["--cfg", "docsrs"]

[features]
# Platform C libm for rlx-libm's `reference` (macOS-exact NumPy/SciPy); off = pure Rust.
libm = ["rlx-libm/libm"]

# The test fixtures are SciPy on macOS arm64: tests compute with its libm.
# (Library builds default to the pure-Rust ports; see rlx-libm `libm`.)
[dev-dependencies]
rlx-libm = { workspace = true, features = ["libm"] }
