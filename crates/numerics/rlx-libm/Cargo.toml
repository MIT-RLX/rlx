[package]
name = "rlx-libm"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "glibc's libm (x86_64 FMA variants) reproduced bit-for-bit in pure Rust: exp, log, log2, pow"
authors.workspace      = true
license.workspace      = true
keywords = ["libm", "glibc", "math", "parity"]
categories = ["science", "mathematics"]
repository.workspace   = true
documentation.workspace = true

[lib]
name = "rlx_libm"
path = "src/lib.rs"

[dependencies]
# Exact (integer) fma for inputs outside `fma_emulated`'s proven range.
libm_crate = { package = "libm", version = "0.2" }

[features]
# wasm32: define the `fma` symbol with `fma_emulated`, replacing the slow
# software fma behind every `f64::mul_add` in the binary.
wasm-fma = []
# wasm32: define expf / logf / log1pf / tanhf / sinf / cosf and exp / log /
# log2 / pow / sin / cos / tan / expm1 / log1p / hypot / erfc with the glibc
# ports, replacing compiler-builtins' weak musl ones for the whole binary, so
# std's float math in every crate rounds as on Linux.
wasm-glibc = []
# Every target: define the `wasm-glibc` symbols (plus `sincos` /
# `__sincos_stret`, which LLVM merges a sin and cos of one argument into),
# and the libm functions with no glibc port here with the `libm` crate's
# pure-Rust ones, so std's float math in every crate of the binary rounds the
# same on macOS, Linux and wasm. For binaries only: it replaces the platform
# libm for the whole program (a NumPy-on-macOS parity test would then see
# glibc's rounding).
export-glibc = []
# The platform's C libm (Apple's libSystem) for `reference` on Apple
# targets, so ports agree bit for bit with NumPy / SciPy / torch running on
# macOS. Off: the pure-Rust ports (glibc's algorithms) everywhere.
libm = []

[lints]
workspace = true
