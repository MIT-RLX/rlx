<text class="ink2" x="224.6" y="214.6" font-size="10" text-anchor="middle">T=5</text>
<text class="ink" x="460" y="100" font-size="13" font-weight="600">k = 4096</text>
<line class="grid" x1="460" x2="760" y1="330.0" y2="330.0"/>
<text class="muted" x="452" y="334.0" font-size="11" text-anchor="end">0</text>
<line class="grid" x1="460" x2="760" y1="256.7" y2="256.7"/>
