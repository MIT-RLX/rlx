<text class="muted" x="452" y="187.3" font-size="11" text-anchor="end">6</text>
<line class="grid" x1="460" x2="760" y1="110.0" y2="110.0"/>
<text class="muted" x="452" y="114.0" font-size="11" text-anchor="end">9</text>
