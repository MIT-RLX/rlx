<line class="grid" x1="625.0" x2="625.0" y1="110" y2="330"/>
<text class="muted" x="625.0" y="346" font-size="11" text-anchor="middle">5</text>
<line class="grid" x1="665.6" x2="665.6" y1="110" y2="330"/>
<text class="muted" x="665.6" y="346" font-size="11" text-anchor="middle">10</text>
<line class="grid" x1="706.3" x2="706.3" y1="110" y2="330"/>
<text class="muted" x="706.3" y="346" font-size="11" text-anchor="middle">20</text>
<line class="grid" x1="760.0" x2="760.0" y1="110" y2="330"/>
<text class="muted" x="760.0" y="346" font-size="11" text-anchor="middle">50</text>
<line class="axis" x1="460" x2="760" y1="330" y2="330"/>
<text class="muted" x="610.0" y="364" font-size="11" text-anchor="middle">seconds (log scale)</text>
<g><title>Lloyd-25: MSE 6.8297 in 30.27 s</title><circle class="s1 ring" cx="730.6" cy="163.1" r="5.5"/></g>
<text class="ink2" x="730.6" y="153.1" font-size="10" text-anchor="middle">Lloyd-25</text>
<g><title>e-means T=1: MSE 4.2086 in 1.76 s</title><rect class="s2 ring" x="558.3" y="221.6" width="11.0" height="11.0" rx="1.5"/></g>
<text class="ink2" x="563.8" y="217.1" font-size="10" text-anchor="middle">T=1</text>
<g><title>e-means T=2: MSE 3.8965 in 2.89 s</title><rect class="s2 ring" x="587.3" y="229.3" width="11.0" height="11.0" rx="1.5"/></g>
<text class="ink2" x="592.8" y="224.8" font-size="10" text-anchor="middle">T=2</text>
