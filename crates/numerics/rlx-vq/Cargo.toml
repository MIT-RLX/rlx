[package]
name = "rlx-vq"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "Fused vector-quantization kernel for RLX — nearest-codebook assignment (cdist→argmin) that beats the matmul+argmin composition. Downstream package; registers against rlx's custom-op scaffold."
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
repository.workspace   = true
homepage.workspace     = true
documentation.workspace = true

[features]
default = ["cpu"]
# CPU execution: registers the fused CpuKernel.
cpu = ["dep:rlx-cpu"]
# Metal execution: registers the fused MetalKernel (macOS only).
metal = ["dep:rlx-metal"]

[dependencies]
rlx-ir = { path = "../../core/rlx-ir", version = "0.2.10" }
rlx-cpu = { path = "../../backends/rlx-cpu", version = "0.2.10", optional = true }
rayon = "1"

[target.'cfg(target_os = "macos")'.dependencies]
rlx-metal = { path = "../../backends/rlx-metal", version = "0.2.10", optional = true }

[dev-dependencies]
rlx-runtime = { path = "../../core/rlx-runtime", version = "0.2.10", features = ["cpu"] }

# Metal/wgpu/MLX-featured runtime for the cross-backend parity test (macOS only).
[target.'cfg(target_os = "macos")'.dev-dependencies]
rlx-runtime = { path = "../../core/rlx-runtime", version = "0.2.10", features = ["cpu", "metal", "gpu", "mlx"] }

[lints]
workspace = true
