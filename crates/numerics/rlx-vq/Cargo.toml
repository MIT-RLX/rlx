[package]
name = "rlx-vq"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "Fused vector-quantization kernel for RLX — nearest-codebook assignment (cdist→argmin) that beats the matmul+argmin composition. Downstream package; registers against rlx's custom-op scaffold."
authors.workspace      = true
license.workspace      = true
readme                 = "README.md"
keywords.workspace     = true
categories.workspace   = true
repository.workspace   = true
homepage.workspace     = true
documentation.workspace = true

[features]
default = ["cpu"]
# CPU execution: registers the fused CpuKernel.
cpu = ["dep:rlx-cpu"]
# Metal execution: registers the fused MetalKernel (macOS only).
metal = ["dep:rlx-metal"]

[dependencies]
rlx-ir = { workspace = true }
rlx-cpu = { workspace = true, optional = true }
rayon = "1"

[target.'cfg(target_os = "macos")'.dependencies]
rlx-metal = { workspace = true, optional = true }

[dev-dependencies]
rlx-runtime = { workspace = true, features = ["cpu"] }

# Metal/wgpu/MLX-featured runtime for the cross-backend parity test (macOS only).
[target.'cfg(target_os = "macos")'.dev-dependencies]
rlx-runtime = { workspace = true, features = ["cpu", "metal", "gpu", "mlx"] }

[lints]
workspace = true
