[package]
name = "rlx-numpy"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "Host-side numpy and torch-CPU numerics reproduced bit-for-bit: pairwise and cascade sums, half-to-even round, linspace, unmerged sin/cos, SIMD tanh, SLEEF exp, .npy I/O"
authors.workspace      = true
license.workspace      = true
keywords = ["numpy", "parity", "pairwise-sum", "linspace", "rounding"]
categories = ["science", "mathematics"]
readme                 = "README.md"
repository.workspace   = true
documentation.workspace = true

[lib]
name = "rlx_numpy"
path = "src/lib.rs"

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args   = ["--cfg", "docsrs"]

[dev-dependencies]
serde_json = "1"
