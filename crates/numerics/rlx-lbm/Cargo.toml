[package]
name = "rlx-lbm"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "Moment-encoded lattice Boltzmann (HOME-LBM) for RLX — D2Q9/D3Q27 reconstruction, collision, and periodic streaming as rlx graphs."
authors.workspace      = true
license.workspace      = true
keywords = ["lbm", "lattice-boltzmann", "cfd", "rlx", "moment-encoded"]
categories.workspace   = true
repository.workspace   = true
homepage.workspace     = true
documentation.workspace = true
readme                  = "README.md"

[features]
default = []

# Build one LBM step as an rlx `Graph` (streaming via `Op::Roll`), so the solver
# runs on every backend through `Session` instead of only on the host.
ir = ["dep:rlx-ir", "dep:rlx-runtime"]

[dependencies]
rlx-ir = { workspace = true, optional = true }
rlx-runtime = { path = "../../core/rlx-runtime", version = "0.2.16", default-features = false, features = ["cpu"], optional = true }

[dev-dependencies]
rlx-ir = { workspace = true }
rlx-runtime = { path = "../../core/rlx-runtime", version = "0.2.16", default-features = false, features = ["cpu"] }

[[test]]
name = "graph_stream"
required-features = ["ir"]

[[test]]
name = "lane_reset"
required-features = ["ir"]

[lints]
workspace = true

[package.metadata.docs.rs]
features       = ["ir"]
rustdoc-args   = ["--cfg", "docsrs"]
all-features   = false
