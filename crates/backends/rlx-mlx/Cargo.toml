[package]
name = "rlx-mlx"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "MLX backend for RLX — Apple's array framework via hand-rolled C++ shim, eager + lazy execution"
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
homepage.workspace     = true
documentation.workspace = true

[features]
default = []
cuda = ["rlx-mlx-sys/cuda"]
# Opt-in: lower `MlxMxfp4` / `MlxMxfp8` `DequantMatMul` via MLX C++
# `quantized_matmul` (mode=mxfp4/mxfp8/nvfp4). Default (off) uses the
# first-class Rust path: host dequant + cache + on-device matmul (same
# layout as CPU/Metal/CUDA `DequantMatMul`).
native-mxfp = []

[dependencies]
rlx-mlx-sys = { workspace = true }
rlx-ir = { workspace = true }
rlx-driver = { workspace = true }
rlx-opt = { workspace = true }
rlx-gguf = { workspace = true }
half = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rlx-cpu = { path = "../rlx-cpu", version = "0.2.14", default-features = false, features = ["blas", "splat"] }
rlx-mlx-io = { workspace = true }
libc = "0.2"

[lints]
workspace = true

[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets        = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
rustdoc-args   = ["--cfg", "docsrs", "--cfg", "rlx_mlx_host"]
all-features  = false
