[package]
name = "rlx-mlx"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "MLX backend for RLX — Apple's array framework via hand-rolled C++ shim, eager + lazy execution"
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
homepage.workspace     = true
documentation.workspace = true

[features]
default = []
cuda = ["rlx-mlx-sys/cuda"]

[dependencies]
rlx-mlx-sys = { path = "../rlx-mlx-sys", version = "0.2.10" }
rlx-ir = { path = "../../core/rlx-ir", version = "0.2.10" }
rlx-driver = { path = "../../core/rlx-driver", version = "0.2.10" }
rlx-opt = { path = "../../core/rlx-opt", version = "0.2.10" }
rlx-gguf = { path = "../../io/rlx-gguf", version = "0.2.10" }
half = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rlx-cpu = { path = "../rlx-cpu", version = "0.2.10", default-features = false, features = ["blas", "splat"] }

[lints]
workspace = true

[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets        = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
rustdoc-args   = ["--cfg", "docsrs", "--cfg", "rlx_mlx_host"]
all-features  = false
