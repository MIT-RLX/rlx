[package]
name = "rlx-webgl"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "WebGL2 GPGPU backend for RLX — render-to-texture execution of IR graphs in the browser (forward + backward)"
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
documentation.workspace = true

[dependencies]
rlx-ir = { workspace = true }
# Op legalization: lower composite/backward ops to the primitive set below.
rlx-autodiff = { workspace = true }
rlx-compile = { workspace = true }
rlx-fusion = { workspace = true }

# Host fallback (`host.rs`): ops with no WebGL lowering run on rlx-cpu, which
# is also what `collective.*` ops delegate to. `default-features = false` drops
# the platform BLAS, so rlx-cpu's pure-Rust paths run — identically on native
# and wasm (rlx-web already links rlx-cpu for its CPU device). The collective
# transport itself (rlx-driver TCP) still exists only off wasm.
rlx-cpu = { path = "../rlx-cpu", version = "0.2.19", default-features = false, features = ["splat"] }
half = "2"

# WebGL2 runtime — wasm only.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.118"
js-sys = "0.3.95"
web-sys = { version = "0.3.95", features = [
    "Document",
    "HtmlCanvasElement",
    "OffscreenCanvas",
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlFramebuffer",
    "WebGlProgram",
    "WebGlShader",
    "WebGlTexture",
    "WebGlUniformLocation",
    "WebGlVertexArrayObject",
    "Window",
    "console",
] }

[dev-dependencies]
# Reference oracle for the native plan/CPU tests: compile + run a graph.
# Path-only (no version): test-only cycle on rlx-runtime (tier 7), which is
# published AFTER rlx-webgl (tier 5). cargo strips path-only dev-deps from the
# published manifest, so this never resolves against crates.io and needs no
# per-release pin bump.
rlx-runtime = { path = "../../core/rlx-runtime" }
# The canonical activation derivatives (rlxsl auto-differentiates the forward),
# the reference for the ActivationBackward kinds rlx-cpu decomposes at AD.
rlxsl = { workspace = true }

# Native-only: registers the `collective.*` op extensions + CPU kernels so the
# exec_cpu `Op::Custom` host-delegate can be tested end-to-end without a network
# (the copy_to_parallel kernel is a pure identity copy, needs no process group).
# Path-only test dep — stripped from the published manifest.
# In-browser tests of the GL shaders themselves (`tests/gl_conv_parity.rs`):
# `wasm-pack`-free, run with wasm-bindgen-test-runner (see that file).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rlx-collectives = { path = "../../core/rlx-collectives" }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args   = ["--cfg", "docsrs"]
all-features   = false
