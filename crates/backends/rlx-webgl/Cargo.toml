[package]
name = "rlx-webgl"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "WebGL2 GPGPU backend for RLX — render-to-texture execution of IR graphs in the browser (forward + backward)"
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
homepage.workspace     = true
documentation.workspace = true

[dependencies]
rlx-ir = { path = "../../core/rlx-ir", version = "0.2.14" }
# Op legalization: lower composite/backward ops to the primitive set below.
rlx-autodiff = { path = "../../core/rlx-autodiff", version = "0.2.14" }
rlx-compile = { path = "../../core/rlx-compile", version = "0.2.14" }
rlx-fusion = { path = "../../core/rlx-fusion", version = "0.2.14" }

# Host/transport `collective.*` ops delegate to the one shared CPU kernel via
# `rlx_cpu::op_registry::run_f32_custom_op_host`. This is NATIVE-only: the
# collective transport (rlx-driver ProcessGroup) uses std::net TCP sockets,
# which don't exist on wasm32/browser — so rlx-cpu is not pulled into the wasm
# build (and the CPU executor errors on a collective there). `default-features
# = false` drops the platform BLAS link (collectives don't GEMM).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rlx-cpu = { path = "../rlx-cpu", version = "0.2.14", default-features = false }

# WebGL2 runtime — wasm only.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.118"
js-sys = "0.3.95"
web-sys = { version = "0.3.95", features = [
    "Document",
    "HtmlCanvasElement",
    "OffscreenCanvas",
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlFramebuffer",
    "WebGlProgram",
    "WebGlShader",
    "WebGlTexture",
    "WebGlUniformLocation",
    "WebGlVertexArrayObject",
    "Window",
] }

[dev-dependencies]
# Reference oracle for the native plan/CPU tests: compile + run a graph.
# Path-only (no version): test-only cycle on rlx-runtime (tier 7), which is
# published AFTER rlx-webgl (tier 5). cargo strips path-only dev-deps from the
# published manifest, so this never resolves against crates.io and needs no
# per-release pin bump.
rlx-runtime = { path = "../../core/rlx-runtime" }

# Native-only: registers the `collective.*` op extensions + CPU kernels so the
# exec_cpu `Op::Custom` host-delegate can be tested end-to-end without a network
# (the copy_to_parallel kernel is a pure identity copy, needs no process group).
# Path-only test dep — stripped from the published manifest.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rlx-collectives = { path = "../../core/rlx-collectives" }

[lints]
workspace = true
