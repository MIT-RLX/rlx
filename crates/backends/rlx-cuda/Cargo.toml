[package]
name = "rlx-cuda"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "NVIDIA CUDA backend — cuBLAS for matmul + NVRTC-compiled kernels for everything else, via the pure-Rust `cudarc` crate."
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
homepage.workspace     = true
documentation.workspace = true
[dependencies]
rlx-gpu-kernels = { path = "../rlx-gpu-kernels", version = "0.2.13" }
rlx-gpu-host = { path = "../rlx-gpu-host", version = "0.2.13" }
rlx-ir = { path = "../../core/rlx-ir", version = "0.2.13" }
rlx-unfuse = { path = "../../core/rlx-unfuse", version = "0.2.13" }
rlx-opt = { path = "../../core/rlx-opt", version = "0.2.13" }
rlx-cpu = { path = "../rlx-cpu", version = "0.2.13", features = ["splat"] }
# IQ-family grid LUTs staged into a device buffer by `iq_grid.rs`.
rlx-gguf = { path = "../../io/rlx-gguf", version = "0.2.13" }
# Runtime dlopen of a pip/conda-installed cuDNN (see `device.rs::preload_real_cudnn`).
libloading = "0.8"

# `dynamic-loading` lets the crate compile and link on hosts without a
# CUDA SDK installed — libcuda is dlopen()'d at runtime. That's what
# makes Mac-side iteration possible: the crate builds, IR-lowering tests
# run, but actual kernel dispatch fails fast when no driver is present.
#
# `cublas` for sgemm. `nvrtc` so we can ship CUDA C++ kernel sources as
# `&'static str` (mirrors rlx-wgpu's WGSL pattern) and JIT-compile them
# on first device init. No nvcc needed at workspace build time.
# `cuda-12030` is the symbol-set floor: cudarc's `dynamic-loading` only
# resolves symbols present in this version, so picking the lowest CUDA
# we want to support keeps the crate runnable across more installs.
# Bumping past 12.3 trips `GetProcAddress` failures on older drivers
# (12.3 ships with macOS-XCode-style "current LTS" Linux distros and is
# common in CI). `nvtx` lives behind the `nvtx` cargo feature below
# because CUDA 13 removed `nvToolsExt.dll` entirely — opting in only
# when actually profiling with nsight keeps the default build runnable
# on modern toolkits.
cudarc = { version = "0.19", default-features = false, features = [
    "std",
    "driver",
    "nvrtc",
    "cublas",
    "cublaslt",
    "cudnn",
    # cuSOLVER for the native batched symmetric eigensolver (`SsyevjBatched`),
    # the on-device forward path for `Op::Eigh` / `Op::EighBatch` (see
    # `eigh_native.rs`). Dynamic-loaded like the rest — no SDK needed to build.
    "cusolver",
    "cuda-12030",
    "dynamic-loading",
] }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
path = "src/lib.rs"

# ── Dev-only validation features ────────────────────────────────
#
# Kernel sources live in `rlx-gpu-kernels`. `hip-cpu-validate` compiles them via HIP-CPU
# headers and runs them on CPU threads instead of via cudarc + libcuda.
# Off by default. Never enabled in workspace `cargo build` / production
# builds. Validate in the linux-gnu Docker image only:
#   `just test-hip-cpu-validate`
#
# Requires HIP-CPU headers at `docker/vendor/HIP-CPU/include` (cloned by fetch-hip-cpu.sh in Docker).
# build.rs compiles `cpp/cpu_dispatch.cpp` against those headers when
# this feature is on; the resulting object file is linked into the
# crate and called via Rust FFI.
[features]
default = []
native-splat = []
# Route pow-2 f32 GPU FFT through NVIDIA cuFFT instead of the native butterfly
# kernels. cudarc dynamically loads libcufft at runtime (same as libcuda), so no
# extra link step. Toggle at runtime with `RLX_FFT_CUFFT=0` to A/B vs native.
cufft = ["cudarc/cufft"]
# Native single-kernel Stockham FFT (cuFFT-parity for n<=1024, no external dep).
# Routes pow-2 f32 FFT (n<=4096) through on-chip butterflies; larger n falls back
# to the multi-kernel path. Takes precedence over `cufft` for its size range.
native-cuda-fft = []
# Opt-in: enable cudarc's nvtx feature + the per-step `scoped_range`
# call in `backend.rs`. CUDA 13 removed `nvToolsExt.dll`, so leaving
# this off by default keeps builds runnable on modern installs. Turn
# on when profiling with nsight-systems on a CUDA 12.x host.
nvtx = ["cudarc/nvtx"]
hip-cpu-validate = ["dep:cc"]

[build-dependencies]
cc = { version = "1", optional = true }

[dev-dependencies]
rlx-runtime = { path = "../../core/rlx-runtime", features = ["cuda", "cpu"] }

[lints]
workspace = true
