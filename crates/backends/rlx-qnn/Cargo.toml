[package]
name = "rlx-qnn"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "Qualcomm Hexagon NPU backend for RLX — IR → QNN model C++ → qnn-net-run on the x86 reference backend."
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
homepage.workspace     = true
documentation.workspace = true
# Library crate + a single emit binary. No proc-macro, no build script.
# The QNN C++ is composed in pure Rust; no SDK headers on disk. The emitted
# run_qnn.sh / verify.py drive the Qualcomm AI Engine Direct (QNN) SDK tools
# (qnn-model-lib-generator + qnn-net-run), which live outside this crate.

[features]
# Off by default: the crate is a dependency-free codegen tool unless you opt
# into the FFI runtime backend, which links the QNN SDK headers at build time.
default = []
# In-process FFI execution on a QNN backend library (Device::Hexagon path).
# Requires QNN_SDK_ROOT at build time; build.rs compiles runtime/rlx_qnn_shim.c.
runtime = []

[dependencies]
rlx-ir = { path = "../../core/rlx-ir", version = "0.2.12" }
# For unrolling Op::Scan into primitives (no native recurrence in QNN codegen).
rlx-opt = { path = "../../core/rlx-opt", version = "0.2.12" }

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rlx-qnn-emit"
path = "src/bin/emit.rs"

[lints]
workspace = true
