[package]
name = "rlx-vulkan"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "Native Vulkan compute backend for RLX (raw `ash` + embedded SPIR-V compute kernels)"
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
homepage.workspace     = true
documentation.workspace = true

[features]
default = []
# Emit Vulkan validation layers when `VK_INSTANCE_LAYERS` is unset (debug aid).
validation = []

[dependencies]
rlx-ir = { path = "../../core/rlx-ir", version = "0.2.13" }
rlx-opt = { path = "../../core/rlx-opt", version = "0.2.13", default-features = false, features = ["compile", "training"] }
rlx-compile = { path = "../../core/rlx-compile", version = "0.2.13" }
# CPU reference kernels for the host-fallback path (sequential / specialized
# ops with no native SPIR-V kernel yet: RNN family, Mamba2, GatedDeltaNet,
# ConvTranspose2d, FFT, GGUF dequant, and the Riemannian / SPD-manifold ops —
# BiMap / ReEig / LogEig / SpdBatchNorm / SpdKarcherMean + backwards). The
# host-visible arena lets the CPU read/write it directly, so the fallback is a
# plain in-place compute — no staging.
#
# `blas` is enabled so the SPD ops' eigendecompositions (LAPACK `dsyevd`, via
# `rlx_cpu::spd`) resolve: on macOS this links the always-present Accelerate
# framework, and on Linux/Windows CI it uses OpenBLAS/MKL when present. It does
# NOT force an OpenBLAS link on a standalone aarch64-Linux/Docker build with no
# OpenBLAS — rlx-cpu's build.rs leaves the BLAS link (and `rlx_cpu_blas` cfg)
# off there and falls back to SIMD, so the driverless build still needs no
# BLAS; only the eigen SPD ops (BiMap, which is pure GEMM, still works) are
# unavailable in that narrow case. `default-features = false` keeps the other
# defaults (e.g. `splat`) off.
rlx-cpu = { path = "../rlx-cpu", version = "0.2.13", default-features = false, features = [
    "blas",
] }
rlx-gpu-host = { path = "../rlx-gpu-host", version = "0.2.13" }

# Raw Vulkan. `loaded` = libloading-based dynamic load of the system
# Vulkan loader at runtime via `Entry::load()`; no link-time dependency on
# libvulkan, so the crate compiles + `cargo build`s on hosts with no Vulkan
# driver (macOS without MoltenVK, CI). `Entry::load()` returns Err there and
# the backend reports itself unavailable — mirrors rlx-cuda/rlx-rocm.
ash = { version = "0.38", default-features = false, features = ["loaded", "std"] }
bytemuck = { version = "1", features = ["derive"] }
half = "2"

[build-dependencies]
# Compile the GLSL `.comp` compute shaders to SPIR-V at BUILD time (pure
# Rust — no glslang/shaderc/Vulkan SDK needed on the build host). The
# resulting `.spv` words are written to OUT_DIR and `include_bytes!`d into
# the crate, so there is no runtime shader compilation. GLSL stays the
# source of record under `shaders/`.
naga = { version = "29", features = ["glsl-in", "spv-out"] }

[dev-dependencies]
half = "2"

[lints]
workspace = true
