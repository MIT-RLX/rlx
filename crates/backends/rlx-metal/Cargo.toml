[package]
name = "rlx-metal"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "Metal backend for RLX — Apple Silicon GPU via Metal Performance Shaders + custom MSL kernels"
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
homepage.workspace     = true
documentation.workspace = true
[dependencies]
rlx-ir = { workspace = true }
rayon = "1"
# Single-source scalar-activation math: `scalar_activation_kernels!` builds the
# per-activation MSL from this manifest at runtime (the A&S erf polynomial lives
# once in rlxsl — MSL has no erf builtin).
rlxsl = { workspace = true }
rlx-opt = { workspace = true }
# `spd` host-fallback (and shared GGUF scheme ids) via rlx-gpu-host.
rlx-gpu-host = { workspace = true }
# rlx-cpu is pulled in solely for its FFT host-fallback kernels
# (`execute_fft1d_f32` / `execute_fft1d_f64`) — Apple Silicon's
# unified memory lets us run them against the Metal arena pointer
# with no copies. A native Metal FFT kernel will replace this when a
# real workload justifies the .metal kernel work.
rlx-cpu = { workspace = true, features = ["splat"] }
# IQ-family grid LUTs (KGRID_IQ2XXS, etc.) staged into a Metal device
# buffer for the IQ2/IQ3/IQ1 dequant kernels.
rlx-gguf = { workspace = true }
bytemuck = { version = "1", features = ["derive"] }
# rlx-splat moved out of tree; restore with the native-splat feature below.
# rlx-splat = { path = "../rlx-splat", version = "0.2.14", optional = true, default-features = false, features = ["reference", "metal"] }

[features]
default = []
# Native MSL raster via `rlx-splat` + `splat.msl` (no `rlx-runtime` on `rlx-splat` — no cycle).
# rlx-splat moved to ../rlx-splat; no-op feature (was ["dep:rlx-splat"]) — keeps cfg gates valid.
native-splat = []
# Single-kernel on-chip FFT for n in (1024, 4096]: keeps the whole transform in
# threadgroup memory (one DRAM load + store) instead of the multi-launch path
# that round-trips DRAM per outer stage. Runtime gate `RLX_FFT_FAST=0` disables.
native-gpu-fft = []

[target.'cfg(all(target_vendor = "apple", not(target_os = "watchos")))'.dependencies]
# No `metal` (metal-rs) crate: `src/mtl.rs` binds the compute subset we use
# directly against the Objective-C runtime. metal-rs pins `block 0.1.6` — whose
# `static` of an uninhabited type is a future-incompatibility error-to-be — and
# still does at 0.33, while `block` is unmaintained. We install no Metal
# completion handlers, so that dependency bought us nothing. Dropping metal-rs
# also drops `foreign-types` and `core-graphics-types`.
objc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
half = "2"


[dev-dependencies]
# Back-edge: rlx-runtime (tier 7) publishes AFTER rlx-metal (tier 6), and no
# published rlx-runtime exposes the `metal` feature. Keep this PATH-ONLY (no
# `version`): cargo strips path-only dev-deps from the published manifest, so
# `cargo publish -p rlx-metal` never resolves runtime against crates.io. The
# path dep wins for local/workspace tests.
rlx-runtime = { path = "../../core/rlx-runtime", features = ["metal"] }
rlx-gguf = { workspace = true }
rlx-cpu = { workspace = true }
rlx-mlx-io = { workspace = true }
rlx-optim = { workspace = true }
tempfile = "3"
safetensors = "0.7"
half = "2"

[lints]
workspace = true

# Apple-Silicon-only crate; render docs against the macOS targets so
# the platform-conditional dependencies and types resolve.
[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets        = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
rustdoc-args   = ["--cfg", "docsrs"]
