[package]
name = "rlx-gguf-convert"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "Convert safetensors / ONNX initializer tensors into GGUF with per-tensor quantization. Useful for shrinking a model's on-disk + in-memory footprint at first load and reusing the GGUF dump on subsequent runs."
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
homepage.workspace     = true
documentation.workspace = true

[features]
# Source readers are opt-in. Default to safetensors only — the
# common case. `onnx` pulls in the heavier rlx-onnx-import crate.
default = ["safetensors"]
safetensors = ["dep:safetensors"]
onnx = ["dep:rlx-onnx-import"]

[dependencies]
rlx-gguf = { path = "../rlx-gguf", version = "0.2.4" }
anyhow = "1"
half = { version = "2", features = ["bytemuck"] }
bytemuck = "1"
safetensors = { version = "0.7", optional = true }
rlx-onnx-import = { path = "../rlx-onnx-import", version = "0.2.4", optional = true, default-features = false }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[[example]]
name = "convert"
path = "examples/convert.rs"
required-features = ["safetensors"]

[[example]]
name = "fidelity_check"
path = "examples/fidelity_check.rs"
required-features = ["safetensors"]
