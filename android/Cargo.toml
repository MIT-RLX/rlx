# Standalone workspace: the JNI cdylib cross-compiles for
# aarch64-linux-android, separate from the host workspace.

[workspace]
members = ["rlx-jni"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.2.20"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The `libm` naga and num-traits depend on, answered by rlx-libm (as in the
# main workspace): no musl copy in the build.
[patch.crates-io]
libm = { path = "../crates/numerics/libm-shim" }
