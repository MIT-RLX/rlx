[package]
name = "rlx-wgpu"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "Cross-platform GPU backend for RLX via wgpu (Metal/Vulkan/DX12/WebGPU)"
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
homepage.workspace     = true
documentation.workspace = true
[features]
default = []
native-splat = []
# `Op::GaussianSplatRender` via CPU reference (D2H) when `splat` is enabled.
splat = ["rlx-cpu/splat"]

[dependencies]
rlx-ir = { path = "../rlx-ir", version = "0.2.4" }
rlx-opt = { path = "../rlx-opt", version = "0.2.4", default-features = false, features = ["compile"] }
rlx-compile = { path = "../rlx-compile", version = "0.2.4" }
rlx-cpu = { path = "../rlx-cpu", version = "0.2.4", features = ["splat"] }

# wgpu 29: brings naga WGSL parser support for `enable f16;` and the
# `f16` type, which unlocks the half-precision storage matmul path.
# Backends picked explicitly. DX12 is enabled for native Windows tensor-core
# paths (preferred over Vulkan when the adapter supports it). GLES excluded.
wgpu = { version = "29", default-features = false, features = [
    "std",
    "parking_lot",
    "vulkan",
    "dx12",
    "metal",
    "wgsl",
    "webgpu",
] }
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
half = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rlx = { path = "../rlx", version = "0.2.4", default-features = false, features = ["cpu", "gpu"] }

[lints]
workspace = true
