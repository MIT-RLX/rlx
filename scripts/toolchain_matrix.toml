# ── ROCm and Vulkan on the 780M (amd rig) ──────────────────────────────────
[[run]]
device = "rocm"
component = "rocm"
version = "7.1"
hardware = "Radeon 780M (gfx1103)"
host = "amd"
workdir = "~/rlx-doctor"
command = "cargo run --offline --release -q -p rlx-check --bin cargo-rlx --features rocm,vulkan -- doctor --device rocm,vulkan"
pass = "ready: ROCm, Vulkan"
timeout_s = 2400
[run.env]
CARGO_TARGET_DIR = "~/rlx-doctor-target"

# ── CUDA on the msi rig ────────────────────────────────────────────────────
[[run]]
device = "cuda"
component = "nvrtc"
version = "13.1"
hardware = "RTX 3080 Ti Laptop (sm_86)"
host = "msi"
workdir = "/tmp/rlxdoctor"
command = "cargo run --release -q -p rlx-check --bin cargo-rlx --features cuda -- doctor --device cuda"
pass = "ready: CUDA"
timeout_s = 2400
[run.env]
CARGO_HOME = "~/rlx-scratch/cargo-home"
CARGO_TARGET_DIR = "~/rlx-scratch/target-doctor"
LD_LIBRARY_PATH = "/usr/local/cuda/lib64"

# ── Upstream projects whose new releases have broken us before ─────────────
[[upstream]]
device = "xdna"
component = "mlir-aie"
github = "Xilinx/mlir-aie"

[[upstream]]
device = "xdna"
component = "xrt"
github = "Xilinx/XRT"
