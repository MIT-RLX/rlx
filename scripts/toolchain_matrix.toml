# Toolchain version matrix — run by scripts/toolchain_matrix.py (`just toolchain-matrix`).
#
# One [[run]] per (device, component version, rig). `env` selects the version
# (each version lives in its own venv / toolkit dir, side by side). `pass` is
# text the command must print, in addition to exiting 0. `workdir` is the rig's
# synced copy of this repo. Add a version by installing it next to the others
# and adding a run; `--update` records the result in tested_toolchains.tsv.

# ── XDNA: mlir-aie releases (each in its own venv on the amd rig) ──────────
# Each release is paired with the llvm-aie (Peano) build its
# utils/peano-requirements.txt pins (1.3.4+). 1.3.0-1.3.3 pin nothing; they use
# the nearest surviving nightly (builds before 2026-06-11 are no longer published).
# 1.2.x and older have no native aiecc (only aiecc.py) — known issue RLX-XDNA-009.
# 1.3.0, 1.3.1 and 1.3.3 fail with every published Peano (registers; f0x literals
# 1.3.3 emits) — kept here so a new Peano that fixes them shows up; RLX-XDNA-011.
[[run]]
device = "xdna"
component = "mlir-aie"
version = "1.3.0"
peano = "21.0.0.2026061101"
hardware = "Ryzen 9 8945HS npu1 fw 1.5.5.391"
host = "amd"
workdir = "~/rlx-doctor"
command = "cargo run --offline --release -q -p rlx-runtime --features xdna --example xdna_graph"
pass = "all NPU graph ops match CPU"
timeout_s = 2400
[run.env]
AIECC = "~/aie-venvs/1.3.0/lib/python3.14/site-packages/mlir_aie/bin/aiecc"
PEANO = "~/peano-venvs/21.0.0.2026061101/lib/python3.14/site-packages/llvm-aie"
XILINX_XRT = "~/xrt-root/usr"
LD_LIBRARY_PATH = "~/xrt-root/usr/lib/x86_64-linux-gnu"
CARGO_TARGET_DIR = "~/rlx-doctor-target"
XDG_CACHE_HOME = "~/rlx-doctor-cache"
RLX_XDNA_ALLOW_KNOWN_BAD = "1"   # measured despite RLX-XDNA-011

