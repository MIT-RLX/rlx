# ── XDNA: XRT releases (each unpacked rootless: `dpkg-deb -x` into ~/xrt-<ver>) ──
# 2.21.75 = Ubuntu 26.04 archive (~/xrt-root); 2.25.0 = ppa:amd-team/xrt
# (2.25.0-4~resolute1, what the #9-#12 reporter runs). Each run builds its own
# rlx XRT shim against that version's headers (RLX_XDNA_SHIM unset).
