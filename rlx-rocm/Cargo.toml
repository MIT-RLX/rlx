[package]
name = "rlx-rocm"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "AMD ROCm/HIP backend — same .cu kernel sources as rlx-cuda, dispatched via HIP."
authors.workspace      = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "README.md"
repository.workspace   = true
homepage.workspace     = true
documentation.workspace = true
[dependencies]
rlx-gpu-kernels = { path = "../rlx-gpu-kernels", version = "0.2.4", features = ["rocm"] }
rlx-ir = { path = "../rlx-ir", version = "0.2.4" }
rlx-opt = { path = "../rlx-opt", version = "0.2.4" }
rlx-cpu = { path = "../rlx-cpu", version = "0.2.4", features = ["splat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"

# libloading dlopens libamdhip64 / libhiprtc at runtime so the crate
# compiles + tests cleanly on hosts that don't have HIP installed
# (Mac, headless CI). Same pattern as cudarc's dynamic-loading for CUDA.

[lib]
path = "src/lib.rs"

# ── Dev-only validation features ────────────────────────────────
#
# `hip-cpu-validate` compiles the same `.cu` kernel sources via HIP-CPU
# headers and runs them on CPU threads — mirroring rlx-cuda's feature.
# Off by default. Validate in Docker only: `just test-hip-cpu-validate`.
#
# Kernel sources live in `rlx-gpu-kernels`. This harness reuses
# rlx-cuda's `cpp/cpu_dispatch.cpp` and HIP-CPU at `rlx-cuda/docker/vendor/HIP-CPU`.
[features]
default = []
native-splat = []
hip-cpu-validate = ["dep:cc"]

[build-dependencies]
cc = { version = "1", optional = true }

[dev-dependencies]
# (none — hip_cpu_validate.rs links against the static lib produced
# by build.rs and uses only std for assertions.)

[lints]
workspace = true
